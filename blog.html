<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Blog</title>

    <!-- Bootstrap -->

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <!-- CSS -->

    <link
    rel="stylesheet"
    href="css/blog.css">

    <link
    rel="stylesheet"
    href="css/comments.css">

</head>

<body>

<section class="py-5">

    <div class="container">

        <div class="row">

            <!-- BLOG POSTS -->

            <div class="col-lg-8">

                <div class="card mb-4 shadow-sm border-0">

                    <img
                    src="images/project.jpg"
                    class="card-img-top">

                    <div class="card-body">

                        <h2 class="card-title">
                            Portfolio Website
                        </h2>

                        <p class="card-text">

                            Đây là dự án portfolio cá nhân
                            được xây dựng bằng Bootstrap 5
                            với thiết kế responsive hiện đại.

                        </p>

                        <span class="badge bg-primary">
                            Bootstrap
                        </span>

                        <span class="badge bg-dark">
                            UI Design
                        </span>

                    </div>

                </div>

                <!-- COMMENT SECTION -->

                <div class="card border-0 shadow-sm p-4">

                    <h3 class="mb-4">
                        Comments
                    </h3>

                    <div class="d-flex mb-4">

                        <img
                        src="images/avatar.jpg"
                        width="60"
                        height="60"
                        class="rounded-circle me-3">

                        <div class="w-100">

                            <textarea
                            class="form-control mb-3"
                            rows="4"
                            placeholder="Write a comment...">
                            </textarea>

                            <button class="btn btn-primary">
                                Post Comment
                            </button>

                        </div>

                    </div>

                </div>

            </div>

            <!-- SIDEBAR -->

            <div class="col-lg-4">

                <div class="sticky-top"
                style="top:30px;">

                    <div class="card border-0 shadow-sm">

                        <div class="card-body">

                            <h4 class="mb-4">
                                Categories
                            </h4>

                            <ul class="list-group">

                                <li class="list-group-item">
                                    Bootstrap
                                </li>

                                <li class="list-group-item">
                                    Web Design
                                </li>

                                <li class="list-group-item">
                                    Responsive
                                </li>

                            </ul>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
